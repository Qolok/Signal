name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests & audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The Firebase Realtime Database emulator is a Java process.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Game-logic regression suite
        run: npm test

      - name: Firebase rules tests (emulator)
        run: npm run test:rules

      # Reported, non-blocking: surfaces advisories without failing the build.
      - name: Dependency audit (non-blocking)
        run: npm audit
        continue-on-error: true
